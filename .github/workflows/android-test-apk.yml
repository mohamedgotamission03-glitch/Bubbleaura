name: Build Android test APK

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  android-test-apk:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - name: Check out project
        uses: actions/checkout@v5

      - name: Set up pnpm
        uses: pnpm/action-setup@v5
        with:
          version: 10

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: pnpm

      - name: Install locked dependencies
        run: pnpm install --frozen-lockfile

      - name: Configure and verify Google test ads (never real ads)
        run: |
          node src/native/use-test-ads.mjs
          node src/native/prepare-test-android.mjs --config-only

      - name: Build bundled game assets
        run: pnpm run build

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Install Android 36 tools
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0" "platform-tools"

      - name: Generate and sync the native Android app
        run: |
          if [ ! -d android ]; then
            pnpm exec cap add android
          fi
          pnpm exec cap sync android
          CAPACITOR_PLATFORM_NAME=android node src/native/configure-admob.mjs
          node src/native/prepare-test-android.mjs

      - name: Build installable debug APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon assembleDebug

      - name: Name the test APK
        run: cp android/app/build/outputs/apk/debug/app-debug.apk Bubblora-test-ads.apk

      - name: Upload downloadable APK
        uses: actions/upload-artifact@v6
        with:
          name: Bubblora-test-ads
          path: Bubblora-test-ads.apk
          if-no-files-found: error
          retention-days: 14
